<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Maid Cozy Game</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/stamina.css" />
<script src="vendor/pixi.min.js"></script>
<!-- Cubism runtime + pixi-live2d5 (PixiJS v8 / Cubism 5 fork) — order matters -->
<script src="vendor/live2dcubismcore.min.js"></script>
<script src="vendor/cubism5.min.js"></script>
<script src="js/config.js"></script>
<script src="js/settings.js"></script>
<script src="js/assets.js"></script>
<script src="js/input.js"></script>
<script src="js/tilemap.js"></script>
<script src="js/entities.js"></script>
<script src="js/camera.js"></script>
<script src="js/effects.js"></script>
<script src="js/audio.js"></script>
<script src="js/live2d.js"></script>
<script src="js/editmode.js"></script>
<script src="js/chat.js"></script>
<script src="js/health.js"></script>
<script src="js/stamina.js"></script>
<script src="js/enemies.js"></script>
<script src="js/gun.js"></script>
<script src="js/situation.js"></script>
<script src="js/brain.js"></script>
<script src="js/inventory.js"></script>
</head>
<body>
<!-- stage-wrap holds the canvas (appended by main.js) + scene-anchored UI.
     Everything editable lives in here so edit mode shares one coordinate space. -->
<div id="stage-wrap">
  <div id="hud">v6 · click to move · P panel · E edit UI · wheel = size · <span id="bg-status">bg?</span> · <span id="l2d-status">l2d?</span> · <span id="fps"></span></div>
  <button id="gear-btn" title="Audio settings">⚙</button>
  <div id="audio-panel">
    <div class="title"><span>🎵 AUDIO</span><span id="saved-flash-audio"></span></div>
    <label>Master<input type="range" id="vol-master" min="0" max="100" step="1"></label>
    <label>BGM<input type="range" id="vol-bgm" min="0" max="100" step="1"></label>
    <label>Voice<input type="range" id="vol-voice" min="0" max="100" step="1"></label>
    <label>Combat<input type="range" id="vol-combat" min="0" max="100" step="1"></label>
    <label class="mute-row"><input type="checkbox" id="audio-mute"> Mute all</label>
  </div>

  <div id="dialog-box"><span id="dialog-text">hi...</span></div>
  <div id="thought-box" title="Her survival brain — separate from chat"><span id="thought-label">💭 tactic</span><span id="thought-text">field is quiet… press 💭 and I’ll size it up.</span><span id="thought-meta"></span></div>
  <div id="combat-bar"><span id="sense-line"></span><button id="think-btn" title="Think now">💭</button></div>
  <div id="bag-btn" title="Inventory (coins)">🎒<span id="inv-count">0</span></div>
  <div id="inv-panel"><div class="title">🎒 INVENTORY</div><div id="inv-grid"></div><div id="inv-meta"></div></div>
  <div id="chat-row"><input id="chat-input" type="text" placeholder="talk to her… (Enter)" autocomplete="off" maxlength="300" /></div>

  <div id="hearts" title="9/9"></div>
  <div id="stamina-wrap"><div id="stamina-bar"><div id="stamina-fill"></div></div><span id="stamina-label"></span></div>
  <div id="goal-line" title="Her standing goal + current task">💤 idle</div>
  <div id="kill-panel" title="Lifetime kills — critters and hunters, saved between visits"><span class="kill-group"><img id="kill-icon" src="assets/enemy.png" alt="critter" onerror="this.style.display='none'" /><span id="kill-count">0</span></span><span class="kill-group"><img id="hunter-icon" src="assets/hunter.png" alt="hunter" onerror="this.style.display='none'" /><span id="hunter-count">0</span></span></div>
  <div id="hurt-flash"></div>
  <div id="faint-veil"><span class="big">SHE FAINTED</span><span class="sub">respawning…</span></div>

  <div id="devpanel">
    <div class="title"><span>⚙ DEV PANEL</span><span id="saved-flash"></span></div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
